<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Chat - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎓 Campus Lost & Found</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-auth-items"></ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-8">
                    
                    <div id="alert-container"></div>

                    <div class="card shadow-sm">
                        <!-- Item Context Header -->
                        <div class="card-header bg-white py-3 border-bottom" id="item-chat-header">
                            <h5 class="mb-0 text-muted">Loading item information...</h5>
                        </div>

                        <!-- Chat Messages Container -->
                        <div class="card-body p-3">
                            <div class="chat-box mb-3 d-flex flex-column" id="chat-box">
                                <div class="text-center text-muted py-4">Connecting to real-time chat...</div>
                            </div>

                            <!-- Typing Indicator -->
                            <div id="typing-indicator" class="typing-indicator px-2 mb-2"></div>

                            <!-- Message Input Form -->
                            <form id="chat-form" class="d-flex gap-2">
                                <input type="text" id="message-input" class="form-control" placeholder="Type a message (e.g. Can you describe the scratch or sticker on it?)..." required autocomplete="off">
                                <button type="submit" class="btn btn-primary px-4">Send</button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container text-muted small">
            &copy; 2026 Campus Lost & Found Platform
        </div>
    </footer>

    <!-- Socket.IO Client Library (served automatically by Socket.IO backend) -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
