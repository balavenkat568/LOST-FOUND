<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎓 Campus Lost & Found</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-auth-items"></ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Browse Lost & Found Items</h2>
                <a href="create-item.html" class="btn btn-primary">+ Post New Item</a>
            </div>

            <div id="alert-container"></div>

            <!-- Search and Filter Form -->
            <div class="card bg-white p-3 mb-4 shadow-sm">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Search Title</label>
                        <input type="text" id="search-input" class="form-control" placeholder="e.g. Calculator, ID Card...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Item Type</label>
                        <select id="type-select" class="form-select">
                            <option value="ALL">All Types</option>
                            <option value="LOST">LOST</option>
                            <option value="FOUND">FOUND</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Category</label>
                        <select id="category-select" class="form-select">
                            <option value="ALL">All Categories</option>
                            <option value="Electronics">Electronics</option>
                            <option value="ID Card">ID Card</option>
                            <option value="Books">Books</option>
                            <option value="Keys">Keys</option>
                            <option value="Bags">Bags</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Calculators">Calculators</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Status</label>
                        <select id="status-select" class="form-select">
                            <option value="ALL">All Statuses</option>
                            <option value="ACTIVE" selected>ACTIVE</option>
                            <option value="RETURNED">RETURNED</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">🔍 Filter</button>
                        <button type="button" id="reset-filters-btn" class="btn btn-outline-secondary">Reset</button>
                    </div>
                </form>
            </div>

            <!-- Items Cards Grid -->
            <div class="row" id="items-grid">
                <!-- Loaded dynamically by js/items.js -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container text-muted small">
            &copy; 2026 Campus Lost & Found Platform
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
