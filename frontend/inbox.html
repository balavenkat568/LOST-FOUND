<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Campus Lost & Found</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎓 Campus Lost & Found</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-auth-items"></ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="py-4">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>📥 My Messages & Inbox</h2>
                <a href="items.html" class="btn btn-outline-secondary">Browse Items</a>
            </div>

            <div id="alert-container"></div>

            <div class="row" id="inbox-container">
                <!-- Loaded dynamically by js/inbox.js -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container text-muted small">
            &copy; 2026 Campus Lost & Found Platform
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inbox.js"></script>

</html>
